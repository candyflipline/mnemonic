[package]
name = "mnemonic-cli"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "mnemonic command line: write the lake, build the cache, import the ClickHouse archive"

[[bin]]
name = "mnemonic"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.40", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
mnemonic = { path = "../../crates/mnemonic" }
mnemonic-repo = { path = "../../crates/mnemonic-repo" }
moraine-config = { path = "../../crates/moraine-config" }
