version: 2
project_name: mnemonic

builds:
  - id: mnemonic
    main: ./cmd/mnemonic
    binary: mnemonic
    tags: [server]
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .ShortCommit }} -X github.com/candyflipline/mnemonic/internal/mcp.Version={{ .Version }}

archives:
  - id: mnemonic
    formats: [tar.gz]
    name_template: "mnemonic_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, NOTICE, README.md]

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"

changelog:
  disable: true

release:
  make_latest: true

brews:
  - name: mnemonic
    repository:
      owner: candyflipline
      name: homebrew-tap
      git:
        url: git@github.com:candyflipline/homebrew-tap.git
        private_key: '{{ index .Env "HOMEBREW_TAP_DEPLOY_KEY" }}'
    directory: Formula
    homepage: https://github.com/candyflipline/mnemonic
    description: Agent session traces from every machine, served to agents over MCP
    license: Apache-2.0
    install: |
      bin.install "mnemonic"
    test: |
      assert_match version.to_s, shell_output("#{bin}/mnemonic version")
    service: |
      run [opt_bin/"mnemonic", "local"]
      keep_alive true
      log_path var/"log/mnemonic.log"
      error_log_path var/"log/mnemonic.log"
