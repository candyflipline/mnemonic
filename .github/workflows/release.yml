name: release
on:
  push:
    tags: ["v*"]
permissions: {}
jobs:
  tap-key:
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: require HOMEBREW_TAP_DEPLOY_KEY
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          if [ -z "$HOMEBREW_TAP_DEPLOY_KEY" ]; then
            echo "::error::the Actions secret HOMEBREW_TAP_DEPLOY_KEY is empty or unset; GoReleaser would skip the Homebrew formula and still pass. Set it (docs/release.md, release day step 4) and push the tag again."
            exit 1
          fi
  gates:
    needs: [tap-key]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: protoc
        run: |
          curl -fsSL -o "$RUNNER_TEMP/protoc.zip" https://github.com/protocolbuffers/protobuf/releases/download/v35.1/protoc-35.1-linux-x86_64.zip
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: CGO_ENABLED=0 go build -o /dev/null ./cmd/mnemonic
      - run: CGO_ENABLED=0 go build -tags server -o /dev/null ./cmd/mnemonic
      - run: go test -p 2 ./...
      - name: check the tagged commit
        run: go run ./scripts/check "$GITHUB_SHA^..$GITHUB_SHA"
  smoke:
    needs: [tap-key]
    permissions:
      contents: read
    uses: ./.github/workflows/smoke.yml
  release:
    needs: [gates, smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
