name: check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: protoc
        run: |
          curl -fsSL -o "$RUNNER_TEMP/protoc.zip" https://github.com/protocolbuffers/protobuf/releases/download/v35.1/protoc-35.1-linux-x86_64.zip
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
      - name: range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            echo "range=$BASE..$HEAD" >> "$GITHUB_OUTPUT"
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "range=$BEFORE..$AFTER" >> "$GITHUB_OUTPUT"
          else
            echo "range=$(git merge-base origin/main "$AFTER")..$AFTER" >> "$GITHUB_OUTPUT"
          fi
      - run: go run ./scripts/check "${{ steps.range.outputs.range }}"
